{%- if include.dataset and include.dataset.headers and include.dataset.rows -%}
<table class="dataset">
  <thead>
    <tr>
      {%- for head in include.dataset.headers -%}
        <th scope="col">{{ head }}</th>
      {%- endfor -%}
    </tr>
  </thead>
  <tbody>
    {%- for row in include.dataset.rows -%}
      <tr>
        {%- for cell in row -%}
          <td>{{ cell }}</td>
        {%- endfor -%}
      </tr>
    {%- endfor -%}
  </tbody>
</table>
{%- endif -%}
